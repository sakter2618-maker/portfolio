# Serves salmaakter.me from this repo through the server's existing Traefik proxy.
# Traefik (in /docker/traefik-gprq) reads these labels and gets a Let's Encrypt certificate automatically.
services:
  portfolio:
    image: nginx:alpine
    container_name: portfolio
    restart: unless-stopped
    volumes:
      - ../:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.portfolio.rule=Host(`salmaakter.me`) || Host(`www.salmaakter.me`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls.certresolver=letsencrypt
      - traefik.http.services.portfolio.loadbalancer.server.port=80
